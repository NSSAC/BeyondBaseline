[build-system]
requires = ["setuptools>=69", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "beyond-baseline"
# Derived from git by setuptools-scm; see [tool.setuptools_scm] below.
dynamic = ["version"]
description = "Scenario sampling runners and evaluation workflows for BeyondBaseline"
readme = "scripts/scenarios_simulation/README.md"
requires-python = ">=3.8"
dependencies = [
  "numpy>=1.21",
  "pandas>=1.4",
  "scipy>=1.8",
  "matplotlib>=3.5",
  "seaborn>=0.12",
  "scikit-learn>=1.1",
  "networkx>=2.8",
]

[project.scripts]
# --- Primary run modes (see vision: operational vs research) --------------
# Operational: one decision, one week, for a health department working from a
# real linelist. No ABM or digital twin required.
beyond-baseline = "scenarios_simulation.run_weekly_sampling:main"
# Research: sweep many scenarios x algorithms over simulated data.
beyond-baseline-sweep = "scenarios_simulation.run_all_scenarios:main"
beyond-baseline-replicates = "scenarios_simulation.run_replicates:main"
beyond-baseline-aggregate = "scenarios_simulation.aggregate_results:main"
beyond-baseline-lasso-greedy = "scenarios_simulation.lasso_test.lasso_test_greedy:main"
beyond-baseline-lasso-stratified = "scenarios_simulation.lasso_test.lasso_test_stratified:main"

# --- Deprecated aliases (kept so existing sbatch scripts keep working) ----
scenarios-runner = "scenarios_simulation.run_all_scenarios:main"
scenarios-weekly = "scenarios_simulation.run_weekly_sampling:main"
scenarios-replicates = "scenarios_simulation.run_replicates:main"
scenarios-lasso-greedy = "scenarios_simulation.lasso_test.lasso_test_greedy:main"
scenarios-lasso-stratified = "scenarios_simulation.lasso_test.lasso_test_stratified:main"
scenarios-aggregate = "scenarios_simulation.aggregate_results:main"

[tool.setuptools_scm]
# Installed from a git URL, never from a release, so a static version misleads
# pip: `pip install --upgrade git+...@main` resolves the URL, sees the version
# it already has, and no-ops. Deriving it from git gives every commit a
# distinct version so --upgrade has something to compare.
#
# REQUIRES AT LEAST ONE TAG. With no tags setuptools-scm emits
# 0.1.devN+g<hash>, which PEP 440 orders *below* 0.1.0, so pip would refuse it
# as a downgrade. Past a v0.1.0 tag it emits 0.1.1.devN+g<hash>, which sorts
# above. fallback_version covers a build with no git metadata.
fallback_version = "0.1.0.dev0+unknown"

[tool.setuptools]
package-dir = {"" = "scripts"}

[tool.setuptools.packages.find]
where = ["scripts"]
include = ["scenarios_simulation*"]
exclude = ["scenarios_simulation.analysis*", "scenarios_simulation.replicate_results*"]
